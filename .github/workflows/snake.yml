name: Contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2E5BFF&color_dots=#E4E9F2,#C7D5FF,#9DB4FF,#5B82FF,#2E5BFF
            dist/snake-dark.svg?palette=github-dark&color_snake=#F2A93B&color_dots=#161B22,#1D2A47,#3A4F86,#5B78C9,#6F94FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
